services:
  unitree-g1-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: unitree_g1_dev:latest
    container_name: unitree_g1_dev
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=0
      - 'CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" priority="default" multicast="default"/></Interfaces></General></Domain></CycloneDDS>'
      
    volumes:
      - /dev/dri/:/dev/dri
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - ./src_volume:/workspace/src

    stdin_open: true  
    tty: true

  zenoh-bridge:
    image: eclipse/zenoh-bridge-dds:latest
    container_name: zenoh_bridge
    network_mode: host
    restart: unless-stopped
    environment:
      - 'CYCLONEDDS_URI=<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="eth0" priority="default" multicast="default"/></Interfaces></General></Domain></CycloneDDS>'
    command: -d 0 --fwd-discovery -a "rt/lowstate|rt/sportmodestate|rt/rosout"